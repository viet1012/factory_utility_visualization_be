        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:9999}
  error:
    include-stacktrace: never

utility:
  finance:
    hourly:
      exchange-rate: 26005
      sepzone: 1.075
    solar:
      exchange-rate: 26005
      sepzone: 1.075
    monthly:
      exchange-rate: 25585
      sepzone: 1.0
    # GET /api/utility/power-usage (same values as hourly for now)
    power-usage:
      exchange-rate: 26005
      sepzone: 1.075
  # cate_id -> ANALOG | STATUS | COUNTER for GET /api/utility/series/history
  # (default ANALOG). Bracket keys that contain '_' or Spring strips it.
  signal-kind:
    default-kind: ANALOG
    codes:
      "[E_EneCon]": COUNTER
      # TODO: map remaining cate_id values (STATUS / COUNTER)

  # GET /api/utility/water-check: pressure readings (kg/cm2, bar, code *PRES*)
  # in [min, max] = STOPPED (pump stopped), below min = SENSOR_FAULT
  water-check:
    pump-stopped-min: -0.3
    pump-stopped-max: 0.2

  history:
    # from up to this many minutes before the oldest raw sample still uses RAW
    raw-tolerance-minutes: 60

  # GET /api/utility/weather (OpenWeatherMap proxy).
  # Key comes only from the OPENWEATHER_API_KEY environment variable; never put it in this file.
  weather:
    api-key: ${OPENWEATHER_API_KEY:}
    lat: 10.889414655521932
    lon: 106.72094061256969
